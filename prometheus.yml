global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'node-app'
    static_configs:
      - targets: ['app:5000']
  
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
